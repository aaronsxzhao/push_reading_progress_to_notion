name: Sync WeRead to Notion

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      book_ids:
        description: 'Optional comma-separated book IDs for resuming a partial sync; empty syncs all books'
        required: false
        default: ''
        type: string
      heatmap_only:
        description: 'Only refresh heatmap (skip book sync)'
        required: false
        default: false
        type: boolean
  repository_dispatch:  # Webhook trigger from anywhere
    types: [sync]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (10 AM Beijing)

concurrency:
  group: weread-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      WEREAD_AUTO_REFRESH_COOKIES: 0
      WEREAD_MAX_WORKERS: 2
      WEREAD_CHAPTER_CACHE_DIR: .cache/weread-chapters
      TZ: Asia/Shanghai
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Restore chapter metadata cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/weread-chapters
        key: weread-chapters-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: weread-chapters-v1-
    
    - name: Fetch cookies from Gist (if configured)
      if: ${{ env.WEREAD_API_KEY == '' }}
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        COOKIE_GIST_ID: ${{ secrets.COOKIE_GIST_ID }}
      run: |
        # Skip if gist not configured
        if [ -z "$COOKIE_GIST_ID" ] || [ -z "$GH_TOKEN" ]; then
          echo "Gist not configured, using WEREAD_COOKIES secret"
          exit 0
        fi
        # Fetch latest cookies from private gist
        COOKIES=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/gists/$COOKIE_GIST_ID" | \
          python3 -c "import sys,json; print(json.load(sys.stdin)['files']['weread_cookies.txt']['content'])" 2>/dev/null || echo "")
        if [ -n "$COOKIES" ]; then
          echo "WEREAD_COOKIES=$COOKIES" >> $GITHUB_ENV
          echo "Using cookies from Gist"
        fi
    
    - name: Renew cookies silently
      if: ${{ env.WEREAD_API_KEY == '' }}
      env:
        WEREAD_COOKIES: ${{ env.WEREAD_COOKIES || secrets.WEREAD_COOKIES }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        COOKIE_GIST_ID: ${{ secrets.COOKIE_GIST_ID }}
        PYTHONUNBUFFERED: 1
      run: |
        python3 -u -c "
        import sys; sys.path.insert(0, 'src')
        from weread_api import WeReadAPI
        import os
        cookies = os.environ.get('WEREAD_COOKIES', '')
        api = WeReadAPI(cookies)
        if api.renew_cookies_silent():
            print('Cookie renewal succeeded')
            new_cookies = api.get_cookie_string()
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write(f'WEREAD_COOKIES={new_cookies}\n')
        else:
            print('Cookie renewal skipped or failed (will use existing cookies)')
        "

    - name: Run sync
      if: ${{ !inputs.heatmap_only }}
      env:
        WEREAD_BOOK_IDS: ${{ inputs.book_ids }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        WEREAD_COOKIES: ${{ env.WEREAD_COOKIES || secrets.WEREAD_COOKIES }}
        PYTHONUNBUFFERED: 1
      run: |
        echo "Starting WeRead to Notion sync..."
        python3 -u src/weread_notion_sync_api.py

    - name: Save chapter metadata cache
      if: ${{ always() && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: .cache/weread-chapters
        key: weread-chapters-v1-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Refresh heatmap from official statistics
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        COOKIE_GIST_ID: ${{ secrets.COOKIE_GIST_ID }}
      run: |
        if [ -n "$WEREAD_API_KEY" ] && [ -n "$GH_TOKEN" ] && [ -n "$COOKIE_GIST_ID" ]; then
          python3 -u scripts/compute_heatmap.py
        else
          echo "Heatmap refresh skipped: requires WEREAD_API_KEY, GH_TOKEN and COOKIE_GIST_ID"
        fi
